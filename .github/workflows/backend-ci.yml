name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    name: Backend Lint, Test & PostGIS Coverage
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: darukaa_earth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio ruff black httpx

      - name: Run Ruff Linting
        run: ruff check app tests

      - name: Run Black Code Formatting Check
        run: black --check app tests

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/darukaa_earth_test
          DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/darukaa_earth_test
          SECRET_KEY: ci-test-secret-key-for-darukaa-earth-platform-1234
          ENVIRONMENT: test
        run: |
          pytest --cov=app --cov-report=term --cov-report=xml -v tests/
